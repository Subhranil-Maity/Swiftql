<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwiftQL</title>
    <script>
      // Pick the theme before the first paint so the loading screen isn't
      // white in dark mode. Same rule as applyTheme in src/stores/theme.ts,
      // which takes over once the app loads.
      try {
        var stored = JSON.parse(localStorage.getItem("swiftql-theme") || "{}");
        var theme = (stored.state && stored.state.theme) || "system";
        var dark =
          theme === "dark" ||
          (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
    <style>
      /* TODO: measure startup in a release build (bun tauri build); the
         dev server's unbundled modules make dev starts slower than real ones.
         Shown until React's first render replaces #root. Colours match
         --background / --muted-foreground in src/index.css. */
      html { background: oklch(1 0 0); color: oklch(0.556 0 0); }
      html.dark { background: oklch(0.145 0 0); color: oklch(0.708 0 0); }
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font: 13px/1.25 system-ui, sans-serif;
        /* A fast start never flashes the spinner. */
        opacity: 0;
        animation: boot-in 200ms ease-out 150ms forwards;
      }
      .boot svg { width: 24px; height: 24px; animation: boot-spin 1s linear infinite; }
      @keyframes boot-in { to { opacity: 1; } }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .boot svg { animation-duration: 3s; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="boot" role="status">
        <!-- Same icon as the app's <Spinner> (lucide loader-circle). -->
        <svg
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
        <span>Loading SwiftQL</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
