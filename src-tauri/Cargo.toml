[package]
name = "swiftql"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "swiftql_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
driver-core = { version = "0.1.0", path = "../crates/driver-core", features = ["specta"] }
driver-postgres = { version = "0.1.0", path = "../crates/driver-postgres" }
config-store = { version = "0.1.0", path = "../crates/config-store", features = ["specta"] }
tokio = { version = "1.54.1", features = ["full"] }
sqlparser = "0.63.0"
tracing = "0.1.44"
specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true
async-trait = "0.1.92"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
chrono = "0.4.45"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3.27.0"
