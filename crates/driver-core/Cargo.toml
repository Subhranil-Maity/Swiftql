[package]
name = "driver-core"
version = "1.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio-util = "0.7.20"
tokio = { version = "1.54.1", features = ["sync"] }
uuid = { version = "1.29.0", features = ["serde"] }
specta = { workspace = true, optional = true }

[features]
specta = ["dep:specta"]
