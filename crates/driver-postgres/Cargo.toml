[package]
name = "driver-postgres"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = "0.4.45"
driver-core = { version = "0.1.0", path = "../driver-core" }
fallible-iterator = "0.2"
futures = "0.3.34"
native-tls = "0.2.18"
postgres-native-tls = "0.5.3"
postgres-protocol = "0.6.12"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt"] }
uuid = "1.29.0"
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
