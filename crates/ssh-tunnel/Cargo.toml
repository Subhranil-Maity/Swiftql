[package]
name = "ssh-tunnel"
version = "1.0.0"
edition = "2024"
description = "SSH tunnels (direct-tcpip) for SwiftQL drivers"

[dependencies]
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1.54.1", features = ["net", "io-util", "sync", "time", "rt"] }
thiserror = "2.0.21"
tracing = "0.1.44"
dirs = "6"
glob = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
