[package]
name = "driver-sqlite"
version = "1.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
driver-core = { version = "1.1.0", path = "../driver-core" }
rusqlite = { version = "0.41.1", features = ["bundled", "column_decltype", "hooks"] }
tokio = { version = "1.54.1", features = ["sync"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
