[package]
name = "config-store"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
driver-core = { version = "0.1.0", path = "../driver-core" }
keyring = "4.2.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
specta = { workspace = true, optional = true }

[features]
specta = ["dep:specta", "driver-core/specta"]

[dev-dependencies]
tempfile = "3.27.0"
